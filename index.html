<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📦 Panel de Inventario</h1>

        <!-- 📊 Tarjetas Informativas -->
        <div class="grid-cards">
            <div class="card stat">
                <h3>Total Productos</h3>
                <p class="number">12</p>
            </div>
            <div class="card stat">
                <h3>Stock Bajo</h3>
                <p class="number alert">2</p>
            </div>
        </div>

        <!-- 📝 Formulario -->
        <div class="card">
            <h2>➕ Añadir Producto</h2>
            <form class="form-group">
                <input type="text" placeholder="Código (Opcional)">
                <input type="text" placeholder="Nombre del producto" required>
                <input type="number" placeholder="Cantidad" required>
                <button type="submit">Guardar</button>
            </form>
        </div>

        <!-- 📋 Tabla -->
        <div class="card">
            <h2>📋 Listado de Stock</h2>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Cantidad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#101</td>
                        <td>Monitor 24"</td>
                        <td>8</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
