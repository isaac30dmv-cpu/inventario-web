<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario y Préstamos 📦</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Inventario y Préstamos 📦</h1>

        <!-- Tarjeta 1: Formulario 📝 -->
        <div class="card">
            <h2 id="formTitulo">Añadir Nuevo Registro</h2>
            <form id="formPrestamo">
                <div class="input-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" placeholder="Nombre del Producto" required>
                </div>
                <div class="input-group">
                    <label for="codigo">Código / Etiqueta</label>
                    <input type="text" id="codigo" placeholder="Código Único">
                </div>
                <div class="input-group">
                    <label for="prestatario">Prestatario</label>
                    <input type="text" id="prestatario" placeholder="Nombre del Solicitante" required>
                </div>
                <div class="input-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <button type="submit" id="btnGuardar" class="btn-primary">Registrar Préstamo ➕</button>
                <button type="button" id="btnCancelar" class="btn-secondary" style="display: none;" onclick="cancelarEdicion()">Cancelar ❌</button>
            </form>
        </div>

        <!-- Tarjeta 2: Panel con Pestañas 📑 -->
        <div class="card">
            <div class="tabs-header">
                <button id="btnTabActivos" class="tab-btn active" onclick="cambiarPestana('activos')">Préstamos Activos 📋</button>
                <button id="btnTabHistorial" class="tab-btn" onclick="cambiarPestana('historial')">Historial de Devoluciones 📜</button>
            </div>

            <!-- Pestaña 1: Préstamos Activos -->
            <div id="tab-activos" class="tab-content active">
                <div class="search-container">
                    <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar por producto, prestatario, código...">
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto 📦</th>
                                <th>Código 🏷️</th>
                                <th>Prestatario 👤</th>
                                <th>Fecha Préstamo 📅</th>
                                <th>Estado / Alerta ⏰</th>
                                <th>Acción 🛠️</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo"></tbody>
                    </table>
                </div>
            </div>

            <!-- Pestaña 2: Historial de Devoluciones -->
            <div id="tab-historial" class="tab-content">
                <div class="card-header-flex">
                    <p class="tab-info">Registro general de elementos devueltos</p>
                    <button id="btnVaciar" class="btn-danger-outline" onclick="vaciarHistorial()">Vaciar Historial 🗑️</button>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto 📦</th>
                                <th>Código 🏷️</th>
                                <th>Prestatario 👤</th>
                                <th>Fecha Préstamo 📅</th>
                                <th>Fecha Devolución 🔄</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formPrestamo');
        const tabla = document.getElementById('tablaCuerpo');
        const tablaHistorial = document.getElementById('tablaHistorial');
        const buscador = document.getElementById('buscador');
        const fechaInput = document.getElementById('fecha');
        const formTitulo = document.getElementById('formTitulo');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnCancelar = document.getElementById('btnCancelar');

        let prestamos = JSON.parse(localStorage.getItem('prestamos')) || [];
        let historial = JSON.parse(localStorage.getItem('historial')) || [];
        let indiceEdicion = null;

        function cambiarPestana(pestana) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (pestana === 'activos') {
                document.getElementById('btnTabActivos').classList.add('active');
                document.getElementById('tab-activos').classList.add('active');
            } else {
                document.getElementById('btnTabHistorial').classList.add('active');
                document.getElementById('tab-historial').classList.add('active');
            }
        }

        function establecerFechaHoy() {
            const hoy = new Date().toISOString().split('T')[0];
            fechaInput.value = hoy;
        }

        function calcularAlerta(fechaPrestamo) {
            const hoy = new Date();
            const inicio = new Date(fechaPrestamo);
            const mesesDiferencia = (hoy.getFullYear() - inicio.getFullYear()) * 12 + (hoy.getMonth() - inicio.getMonth());

            if (mesesDiferencia >= 12) {
                return { texto: 'Atención Inmediata (12+ Meses) 🚨', clase: 'alerta-12' };
            } else if (mesesDiferencia >= 6) {
                return { texto: 'Préstamo de 6+ Meses ⚠️', clase: 'alerta-6' };
            } else {
                return { texto: 'En Regla ✅', clase: 'normal' };
            }
        }

        function renderizarTabla(filtro = '') {
            tabla.innerHTML = '';

            const prestamosFiltrados = prestamos.filter(item => {
                const texto = filtro.toLowerCase();
                return item.producto.toLowerCase().includes(texto) ||
                       item.prestatario.toLowerCase().includes(texto) ||
                       (item.codigo && item.codigo.toLowerCase().includes(texto));
            });

            if (prestamosFiltrados.length === 0) {
                tabla.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #64748b; padding: 20px;">No se encontraron registros activos.</td></tr>`;
                return;
            }

            prestamosFiltrados.forEach((item) => {
                const indiceOriginal = prestamos.indexOf(item);
                const alerta = calcularAlerta(item.fecha);
                const fila = document.createElement('tr');
                
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge ${alerta.clase}">${alerta.texto}</span></td>
                    <td class="actions-cell">
                        <button class="btn-icon" title="Editar" onclick="editarPrestamo(${indiceOriginal})">✏️</button>
                        <button class="btn-icon" title="Devolver" onclick="devolverPrestamo(${indiceOriginal})">🔄</button>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        }

        function renderizarHistorial() {
            tablaHistorial.innerHTML = '';

            if (historial.length === 0) {
                tablaHistorial.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #64748b; padding: 20px;">No hay devoluciones registradas.</td></tr>`;
                return;
            }

            historial.forEach((item) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge devuelto">${item.fechaDevolucion}</span></td>
                `;
                tablaHistorial.appendChild(fila);
            });
        }

        function editarPrestamo(indice) {
            const item = prestamos[indice];
            document.getElementById('producto').value = item.producto;
            document.getElementById('codigo').value = item.codigo || '';
            document.getElementById('prestatario').value = item.prestatario;
            document.getElementById('fecha').value = item.fecha;

            indiceEdicion = indice;
            formTitulo.innerText = "Editar Registro ✏️";
            btnGuardar.innerText = "Guardar Cambios 💾";
            btnCancelar.style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            indiceEdicion = null;
            form.reset();
            establecerFechaHoy();
            formTitulo.innerText = "Añadir Nuevo Registro";
            btnGuardar.innerText = "Registrar Préstamo ➕";
            btnCancelar.style.display = "none";
        }

        function devolverPrestamo(indice) {
            const itemDevuelto = prestamos[indice];
            const hoy = new Date();
            const fechaDevolucion = hoy.toLocaleDateString('es-ES');

            historial.unshift({ ...itemDevuelto, fechaDevolucion });
            prestamos.splice(indice, 1);

            if (indiceEdicion === indice) cancelarEdicion();

            localStorage.setItem('prestamos', JSON.stringify(prestamos));
            localStorage.setItem('historial', JSON.stringify(historial));

            renderizarTabla(buscador.value);
            renderizarHistorial();
        }

        function vaciarHistorial() {
            if (historial.length === 0) return;
            if (confirm('¿Estás seguro de que deseas borrar todo el historial de devoluciones?')) {
                historial = [];
                localStorage.removeItem('historial');
                renderizarHistorial();
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const datosGuardar = {
                producto: document.getElementById('producto').value,
                codigo: document.getElementById('codigo').value,
                prestatario: document.getElementById('prestatario').value,
                fecha: document.getElementById('fecha').value
            };

            if (indiceEdicion !== null) {
                prestamos[indiceEdicion] = datosGuardar;
            } else {
                prestamos.push(datosGuardar);
            }

            localStorage.setItem('prestamos', JSON.stringify(prestamos));
            cancelarEdicion();
            renderizarTabla(buscador.value);
        });

        buscador.addEventListener('input', (e) => {
            renderizarTabla(e.target.value);
        });

        establecerFechaHoy();
        renderizarTabla();
        renderizarHistorial();
    </script>
</body>
</html>
