<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario y Préstamos 📦</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Inventario y Préstamos 📦</h1>

        <!-- Tarjeta 1: Formulario 📝 -->
        <div class="card">
            <h2>Añadir Nuevo Registro</h2>
            <form id="formPrestamo">
                <div class="input-group">
                    <label for="producto">Producto</label>
                    <input type="text" id="producto" placeholder="Nombre del Producto" required>
                </div>
                <div class="input-group">
                    <label for="codigo">Código / Etiqueta</label>
                    <input type="text" id="codigo" placeholder="Código Único">
                </div>
                <div class="input-group">
                    <label for="prestatario">Prestatario</label>
                    <input type="text" id="prestatario" placeholder="Nombre del Solicitante" required>
                </div>
                <div class="input-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>
                <button type="submit" class="btn-primary">Registrar Préstamo ➕</button>
            </form>
        </div>

        <!-- Tarjeta 2: Tabla e Inventario Activo 📋 -->
        <div class="card">
            <h2>Inventario Activo y Filtros</h2>
            
            <div class="search-container">
                <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar por producto, prestatario, código...">
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Producto 📦</th>
                            <th>Código 🏷️</th>
                            <th>Prestatario 👤</th>
                            <th>Fecha Préstamo 📅</th>
                            <th>Estado / Alerta ⏰</th>
                            <th>Acción 🛠️</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCuerpo"></tbody>
                </table>
            </div>
        </div>

        <!-- Tarjeta 3: Historial de Devoluciones 📜 -->
        <div class="card">
            <div class="card-header-flex">
                <h2>Historial de Devoluciones 📜</h2>
                <button id="btnVaciar" class="btn-danger-outline" onclick="vaciarHistorial()">Vaciar Historial 🗑️</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Producto 📦</th>
                            <th>Código 🏷️</th>
                            <th>Prestatario 👤</th>
                            <th>Fecha Préstamo 📅</th>
                            <th>Fecha Devolución 🔄</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHistorial"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formPrestamo');
        const tabla = document.getElementById('tablaCuerpo');
        const tablaHistorial = document.getElementById('tablaHistorial');
        const buscador = document.getElementById('buscador');

        let prestamos = JSON.parse(localStorage.getItem('prestamos')) || [];
        let historial = JSON.parse(localStorage.getItem('historial')) || [];

        function calcularAlerta(fechaPrestamo) {
            const hoy = new Date();
            const inicio = new Date(fechaPrestamo);
            
            const mesesDiferencia = (hoy.getFullYear() - inicio.getFullYear()) * 12 + (hoy.getMonth() - inicio.getMonth());

            if (mesesDiferencia >= 12) {
                return { texto: 'Atención Inmediata (12+ Meses) 🚨', clase: 'alerta-12' };
            } else if (mesesDiferencia >= 6) {
                return { texto: 'Préstamo de 6+ Meses ⚠️', clase: 'alerta-6' };
            } else {
                return { texto: 'En Regla ✅', clase: 'normal' };
            }
        }

        function renderizarTabla(filtro = '') {
            tabla.innerHTML = '';

            const prestamosFiltrados = prestamos.filter(item => {
                const texto = filtro.toLowerCase();
                return item.producto.toLowerCase().includes(texto) ||
                       item.prestatario.toLowerCase().includes(texto) ||
                       (item.codigo && item.codigo.toLowerCase().includes(texto));
            });

            if (prestamosFiltrados.length === 0) {
                tabla.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #64748b; padding: 20px;">No se encontraron registros activos.</td></tr>`;
                return;
            }

            prestamosFiltrados.forEach((item) => {
                const indiceOriginal = prestamos.indexOf(item);
                const alerta = calcularAlerta(item.fecha);
                const fila = document.createElement('tr');
                
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge ${alerta.clase}">${alerta.texto}</span></td>
                    <td class="actions-cell">
                        <button class="btn-icon" title="Devolver" onclick="devolverPrestamo(${indiceOriginal})">🔄</button>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        }

        function renderizarHistorial() {
            tablaHistorial.innerHTML = '';

            if (historial.length === 0) {
                tablaHistorial.innerHTML = `<tr><td colspan="5" style="text-align:center; color: #64748b; padding: 20px;">No hay devoluciones registradas.</td></tr>`;
                return;
            }

            historial.forEach((item) => {
                const fila = document.createElement('tr');
                
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge devuelto">${item.fechaDevolucion}</span></td>
                `;
                tablaHistorial.appendChild(fila);
            });
        }

        function devolverPrestamo(indice) {
            const itemDevuelto = prestamos[indice];
            
            // Obtener fecha actual en formato legible (ej. DD/MM/AAAA)
            const hoy = new Date();
            const fechaDevolucion = hoy.toLocaleDateString('es-ES');

            // Mover al historial
            historial.unshift({
                ...itemDevuelto,
                fechaDevolucion: fechaDevolucion
            });

            // Eliminar de préstamos activos
            prestamos.splice(indice, 1);

            // Actualizar localStorage
            localStorage.setItem('prestamos', JSON.stringify(prestamos));
            localStorage.setItem('historial', JSON.stringify(historial));

            renderizarTabla(buscador.value);
            renderizarHistorial();
        }

        function vaciarHistorial() {
            if (historial.length === 0) return;
            if (confirm('¿Estás seguro de que deseas borrar todo el historial de devoluciones?')) {
                historial = [];
                localStorage.removeItem('historial');
                renderizarHistorial();
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const nuevoPrestamo = {
                producto: document.getElementById('producto').value,
                codigo: document.getElementById('codigo').value,
                prestatario: document.getElementById('prestatario').value,
                fecha: document.getElementById('fecha').value
            };

            prestamos.push(nuevoPrestamo);
            localStorage.setItem('prestamos', JSON.stringify(prestamos));
            form.reset();
            renderizarTabla(buscador.value);
        });

        buscador.addEventListener('input', (e) => {
            renderizarTabla(e.target.value);
        });

        // Cargar ambas tablas al iniciar
        renderizarTabla();
        renderizarHistorial();
    </script>
</body>
</html>
