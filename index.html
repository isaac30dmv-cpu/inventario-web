<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario y Préstamos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <!-- Encabezado con Indicador En Vivo y Modo Oscuro -->
        <div class="header-container">
            <h1>Gestión de Inventario y Préstamos 📦</h1>
            <div class="header-actions">
                <div class="live-indicator">
                    <span class="live-dot"></span> En vivo
                </div>
                <button id="themeToggle" class="btn-theme" title="Cambiar tema">🌙</button>
            </div>
        </div>

        <!-- Barra de Copias de Seguridad y Exportación -->
        <div class="card security-bar">
            <span class="security-title">Seguridad de Datos 💾:</span>
            <div class="security-buttons">
                <button class="btn-sec btn-json" onclick="exportarJSON()">📦 Copia JSON</button>
                <button class="btn-sec btn-json" onclick="document.getElementById('jsonFileInput').click()">📥 Restaurar JSON</button>
                <button class="btn-sec btn-csv" onclick="exportarCSV()">📄 Exportar Excel (CSV)</button>
            </div>
            <input type="file" id="jsonFileInput" accept=".json" style="display:none;" onchange="importarJSON(event)">
        </div>

        <!-- Formulario para Añadir / Editar Préstamo -->
        <div class="card">
            <h2 class="card-title" id="formTitulo">Añadir Nuevo Registro</h2>
            <form id="formPrestamo">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="producto">Producto</label>
                        <input type="text" id="producto" class="form-control" placeholder="Nombre del Producto" required>
                    </div>
                    <div class="form-group">
                        <label for="codigo">Código / Etiqueta</label>
                        <input type="text" id="codigo" class="form-control" placeholder="Código Único">
                    </div>
                    <div class="form-group">
                        <label for="prestatario">Prestatario</label>
                        <input type="text" id="prestatario" class="form-control" placeholder="Nombre del Solicitante" required>
                    </div>
                    <div class="form-group">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" class="form-control" required>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="btnGuardar" class="btn-primary">Registrar Préstamo ➕</button>
                    <button type="button" id="btnCancelar" class="btn-secondary" style="display:none;" onclick="cancelarEdicion()">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Panel Principal con Pestañas -->
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" id="btnTabActivos" onclick="cambiarPestana('activos')">Préstamos Activos 📋</button>
                <button class="tab-btn" id="btnTabHistorial" onclick="cambiarPestana('historial')">Historial de Devoluciones 📜</button>
            </div>

            <!-- Pestaña: Préstamos Activos -->
            <div id="tab-activos" class="tab-content active">
                <div class="controls-bar">
                    <div class="pills-group">
                        <button class="pill-btn active" onclick="filtrarPorEstado('todos', this)">Todos</button>
                        <button class="pill-btn" onclick="filtrarPorEstado('ok', this)">En Regla ✅</button>
                        <button class="pill-btn" onclick="filtrarPorEstado('alerta', this)">En Alerta ⚠️</button>
                    </div>
                    <div class="sort-group">
                        <label for="selectOrden">Ordenar por:</label>
                        <select id="selectOrden" class="form-control" style="width: auto;" onchange="cambiarOrden(this.value)">
                            <option value="fecha-desc">Fecha (Más reciente)</option>
                            <option value="fecha-asc">Fecha (Más antigua)</option>
                            <option value="nombre-asc">Producto (A-Z)</option>
                            <option value="prestatario-asc">Prestatario (A-Z)</option>
                        </select>
                    </div>
                </div>

                <div class="search-container">
                    <input type="text" id="buscador" class="search-input" placeholder="🔍 Buscar por producto, prestatario, código...">
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto 📦</th>
                                <th>Código 🏷️</th>
                                <th>Prestatario 👤</th>
                                <th>Fecha Préstamo 📅</th>
                                <th>Estado / Alerta ⏰</th>
                                <th>Acción 🛠️</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo">
                            <!-- Inserción dinámica de registros -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pestaña: Historial de Devoluciones -->
            <div id="tab-historial" class="tab-content">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 14px;">
                    <button class="btn-sec" style="color: #ef4444; border-color: #fca5a5;" onclick="solicitarVaciarHistorial()">🗑️ Vaciar Historial</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Producto 📦</th>
                                <th>Código 🏷️</th>
                                <th>Prestatario 👤</th>
                                <th>Fecha Préstamo 📅</th>
                                <th>Devuelto el 🔄</th>
                            </tr>
                        </thead>
                        <tbody id="tablaHistorial">
                            <!-- Inserción dinámica de historial -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Personalizada de Confirmación -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h3 class="modal-title" id="modalTitulo">Confirmación</h3>
            <p class="modal-body" id="modalMensaje">¿Estás seguro de realizar esta acción?</p>
            <div class="modal-actions">
                <button class="btn-secondary" id="btnModalCancelar">Cancelar</button>
                <button class="btn-primary" id="btnModalConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('formPrestamo');
        const tabla = document.getElementById('tablaCuerpo');
        const tablaHistorial = document.getElementById('tablaHistorial');
        const buscador = document.getElementById('buscador');
        const fechaInput = document.getElementById('fecha');
        const formTitulo = document.getElementById('formTitulo');
        const btnGuardar = document.getElementById('btnGuardar');
        const btnCancelar = document.getElementById('btnCancelar');
        const themeToggle = document.getElementById('themeToggle');

        let prestamos = [];
        let historial = [];
        let idEdicion = null;
        let estadoFiltroActual = 'todos';
        let ordenActual = 'fecha-desc';

        // --- MODO OSCURO / CLARO ---
        function inicializarTema() {
            const temaGuardado = localStorage.getItem('theme');
            if (temaGuardado === 'dark') {
                document.body.classList.add('dark-theme');
                themeToggle.innerText = '☀️';
            } else {
                themeToggle.innerText = '🌙';
            }
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            const esOscuro = document.body.classList.contains('dark-theme');
            localStorage.setItem('theme', esOscuro ? 'dark' : 'light');
            themeToggle.innerText = esOscuro ? '☀️' : '🌙';
        });

        // --- VENTANA MODAL PERSONALIZADA ---
        function mostrarModal(titulo, mensaje) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('modalOverlay');
                const modalTitulo = document.getElementById('modalTitulo');
                const modalMensaje = document.getElementById('modalMensaje');
                const btnConfirmar = document.getElementById('btnModalConfirmar');
                const btnCancelarModal = document.getElementById('btnModalCancelar');

                modalTitulo.innerText = titulo;
                modalMensaje.innerText = mensaje;
                overlay.classList.add('active');

                const cerrar = (resultado) => {
                    overlay.classList.remove('active');
                    btnConfirmar.onclick = null;
                    btnCancelarModal.onclick = null;
                    resolve(resultado);
                };

                btnConfirmar.onclick = () => cerrar(true);
                btnCancelarModal.onclick = () => cerrar(false);
            });
        }

        // --- COMUNICACIÓN CON BASE DE DATOS Y POLLING INTELIGENTE ---
        async function cargarDatosDesdeServidor(silencioso = false) {
            try {
                const response = await fetch('api.php?action=get_all');
                const res = await response.json();
                if (res.status === 'success') {
                    const nuevosPrestamos = res.prestamos || [];
                    const nuevoHistorial = res.historial || [];

                    // Migración automática inicial desde localStorage si existían datos antiguos
                    const localP = JSON.parse(localStorage.getItem('prestamos')) || [];
                    const localH = JSON.parse(localStorage.getItem('historial')) || [];
                    if (nuevosPrestamos.length === 0 && nuevoHistorial.length === 0 && (localP.length > 0 || localH.length > 0)) {
                        await fetch('api.php?action=importar_backup', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ prestamos: localP, historial: localH })
                        });
                        localStorage.removeItem('prestamos');
                        localStorage.removeItem('historial');
                        await cargarDatosDesdeServidor();
                        return;
                    }

                    // Comprobar si realmente ha habido cambios para evitar parpadeos innecesarios
                    const prestamosCambiados = JSON.stringify(prestamos) !== JSON.stringify(nuevosPrestamos);
                    const historialCambiado = JSON.stringify(historial) !== JSON.stringify(nuevoHistorial);

                    if (prestamosCambiados || historialCambiado || !silencioso) {
                        prestamos = nuevosPrestamos;
                        historial = nuevoHistorial;
                        renderizarTabla(buscador.value);
                        renderizarHistorial();
                    }
                }
            } catch (err) {
                console.error('Error al sincronizar con el servidor:', err);
            }
        }

        // Iniciar actualización automática en tiempo real cada 5 segundos (5000 ms)
        function iniciarAutoActualizacion() {
            setInterval(() => {
                // Solo auto-actualizar en segundo plano si el usuario no está editando un registro actualmente
                if (idEdicion === null) {
                    cargarDatosDesdeServidor(true);
                }
            }, 5000);
        }

        // --- COPIAS DE SEGURIDAD (JSON / CSV) ---
        function exportarJSON() {
            if (prestamos.length === 0 && historial.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }
            const backupData = {
                fechaBackup: new Date().toISOString(),
                prestamos: prestamos,
                historial: historial
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_inventario_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarJSON(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (Array.isArray(data.prestamos) && Array.isArray(data.historial)) {
                        const confirmado = await mostrarModal(
                            "Restaurar Copia de Seguridad",
                            "¿Deseas reemplazar la base de datos del servidor con los datos de esta copia de seguridad?"
                        );
                        if (confirmado) {
                            const response = await fetch('api.php?action=importar_backup', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(data)
                            });
                            const res = await response.json();
                            if (res.status === 'success') {
                                await cargarDatosDesdeServidor();
                                alert("¡Copia de seguridad restaurada con éxito en el servidor! ✅");
                            } else {
                                alert("Error al importar: " + res.message);
                            }
                        }
                    } else {
                        alert("El archivo JSON no tiene una estructura válida.");
                    }
                } catch (err) {
                    alert("Error al procesar el archivo JSON: " + err.message);
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function exportarCSV() {
            if (prestamos.length === 0 && historial.length === 0) {
                alert("No hay registros para exportar.");
                return;
            }

            let csvContent = "\uFEFF"; // BOM UTF-8
            csvContent += "EstadoRegistro,Producto,Codigo,Prestatario,FechaPrestamo,FechaDevolucion\n";

            prestamos.forEach(item => {
                csvContent += `"Activo","${item.producto}","${item.codigo || ''}","${item.prestatario}","${item.fecha}",""\n`;
            });

            historial.forEach(item => {
                csvContent += `"Devuelto","${item.producto}","${item.codigo || ''}","${item.prestatario}","${item.fecha}","${item.fechaDevolucion}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `inventario_completo_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- NAVEGACIÓN Y FECHA ---
        function cambiarPestana(pestana) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (pestana === 'activos') {
                document.getElementById('btnTabActivos').classList.add('active');
                document.getElementById('tab-activos').classList.add('active');
            } else {
                document.getElementById('btnTabHistorial').classList.add('active');
                document.getElementById('tab-historial').classList.add('active');
            }
        }

        function establecerFechaHoy() {
            const hoy = new Date().toISOString().split('T')[0];
            fechaInput.value = hoy;
        }

        function calcularAlerta(fechaPrestamo) {
            const hoy = new Date();
            const inicio = new Date(fechaPrestamo);
            const mesesDiferencia = (hoy.getFullYear() - inicio.getFullYear()) * 12 + (hoy.getMonth() - inicio.getMonth());

            if (mesesDiferencia >= 12) {
                return { texto: 'Atención Inmediata (12+ Meses) 🚨', clase: 'alerta-12', estado: 'alerta' };
            } else if (mesesDiferencia >= 6) {
                return { texto: 'Préstamo de 6+ Meses ⚠️', clase: 'alerta-6', estado: 'alerta' };
            } else {
                return { texto: 'En Regla ✅', clase: 'normal', estado: 'ok' };
            }
        }

        // --- FILTROS Y ORDENACIÓN ---
        function filtrarPorEstado(estado, elemento) {
            estadoFiltroActual = estado;
            document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            renderizarTabla(buscador.value);
        }

        function cambiarOrden(criterio) {
            ordenActual = criterio;
            renderizarTabla(buscador.value);
        }

        function ordenarLista(lista) {
            return lista.sort((a, b) => {
                if (ordenActual === 'fecha-desc') return new Date(b.fecha) - new Date(a.fecha);
                if (ordenActual === 'fecha-asc') return new Date(a.fecha) - new Date(b.fecha);
                if (ordenActual === 'nombre-asc') return a.producto.localeCompare(b.producto);
                if (ordenActual === 'prestatario-asc') return a.prestatario.localeCompare(b.prestatario);
                return 0;
            });
        }

        // --- RENDERIZADO DE TABLAS ---
        function renderizarTabla(filtroTexto = '') {
            tabla.innerHTML = '';

            let prestamosFiltrados = prestamos.filter(item => {
                const texto = filtroTexto.toLowerCase();
                const coincideTexto = item.producto.toLowerCase().includes(texto) ||
                                     item.prestatario.toLowerCase().includes(texto) ||
                                     (item.codigo && item.codigo.toLowerCase().includes(texto));

                const alerta = calcularAlerta(item.fecha);
                const coincideEstado = (estadoFiltroActual === 'todos') || (alerta.estado === estadoFiltroActual);

                return coincideTexto && coincideEstado;
            });

            prestamosFiltrados = ordenarLista(prestamosFiltrados);

            if (prestamosFiltrados.length === 0) {
                tabla.innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 20px;">No se encontraron registros activos.</td></tr>`;
                return;
            }

            prestamosFiltrados.forEach((item) => {
                const alerta = calcularAlerta(item.fecha);
                const fila = document.createElement('tr');
                
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge ${alerta.clase}">${alerta.texto}</span></td>
                    <td class="actions-cell">
                        <button class="btn-icon" title="Editar" onclick="editarPrestamo(${item.id})">✏️</button>
                        <button class="btn-icon" title="Devolver" onclick="devolverPrestamo(${item.id})">🔄</button>
                    </td>
                `;
                tabla.appendChild(fila);
            });
        }

        function renderizarHistorial() {
            tablaHistorial.innerHTML = '';

            if (historial.length === 0) {
                tablaHistorial.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">No hay devoluciones registradas.</td></tr>`;
                return;
            }

            historial.forEach((item) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><strong>${item.producto}</strong></td>
                    <td>${item.codigo || '-'}</td>
                    <td>${item.prestatario}</td>
                    <td>${item.fecha}</td>
                    <td><span class="badge devuelto">${item.fechaDevolucion}</span></td>
                `;
                tablaHistorial.appendChild(fila);
            });
        }

        // --- ACCIONES CON EL SERVIDOR ---
        function editarPrestamo(id) {
            const item = prestamos.find(p => Number(p.id) === Number(id));
            if (!item) return;

            document.getElementById('producto').value = item.producto;
            document.getElementById('codigo').value = item.codigo || '';
            document.getElementById('prestatario').value = item.prestatario;
            document.getElementById('fecha').value = item.fecha;

            idEdicion = id;
            formTitulo.innerText = "Editar Registro ✏️";
            btnGuardar.innerText = "Guardar Cambios 💾";
            btnCancelar.style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            idEdicion = null;
            form.reset();
            establecerFechaHoy();
            formTitulo.innerText = "Añadir Nuevo Registro";
            btnGuardar.innerText = "Registrar Préstamo ➕";
            btnCancelar.style.display = "none";
        }

        async function devolverPrestamo(id) {
            const hoy = new Date();
            const fechaDevolucion = hoy.toLocaleDateString('es-ES');

            try {
                const response = await fetch('api.php?action=devolver_prestamo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id, fechaDevolucion: fechaDevolucion })
                });
                const res = await response.json();
                if (res.status === 'success') {
                    if (idEdicion === id) cancelarEdicion();
                    await cargarDatosDesdeServidor();
                } else {
                    alert('Error al devolver el préstamo: ' + res.message);
                }
            } catch (err) {
                console.error('Error al realizar devolución:', err);
            }
        }

        async function solicitarVaciarHistorial() {
            if (historial.length === 0) return;
            const confirmado = await mostrarModal(
                'Vaciar Historial', 
                '¿Estás seguro de que deseas eliminar permanentemente todos los registros del historial de devoluciones del servidor?'
            );

            if (confirmado) {
                try {
                    const response = await fetch('api.php?action=vaciar_historial', { method: 'POST' });
                    const res = await response.json();
                    if (res.status === 'success') {
                        await cargarDatosDesdeServidor();
                    } else {
                        alert('Error al vaciar historial: ' + res.message);
                    }
                } catch (err) {
                    console.error('Error al vaciar historial:', err);
                }
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const datosGuardar = {
                producto: document.getElementById('producto').value,
                codigo: document.getElementById('codigo').value,
                prestatario: document.getElementById('prestatario').value,
                fecha: document.getElementById('fecha').value
            };

            let url = 'api.php?action=add_prestamo';
            if (idEdicion !== null) {
                url = 'api.php?action=edit_prestamo';
                datosGuardar.id = idEdicion;
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosGuardar)
                });
                const res = await response.json();
                if (res.status === 'success') {
                    cancelarEdicion();
                    await cargarDatosDesdeServidor();
                } else {
                    alert('Error al guardar el registro: ' + res.message);
                }
            } catch (err) {
                console.error('Error al conectar con la API:', err);
            }
        });

        buscador.addEventListener('input', (e) => {
            renderizarTabla(e.target.value);
        });

        // Inicialización
        inicializarTema();
        establecerFechaHoy();
        cargarDatosDesdeServidor();
        iniciarAutoActualizacion();
    </script>
</body>
</html>
